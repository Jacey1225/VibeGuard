site_name: VibeGuard
site_description: Security vulnerability scanning and code-review tool.
docs_dir: docs

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - API Reference: api.md
  - Deployment: deployment.md
  - Development: development.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
