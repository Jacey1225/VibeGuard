[project]
name = "vibeguard"
version = "0.1.0"
description = "Security vulnerability scanning and code-review tool"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "httpx==0.28.1",
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-postgresql==6.1.1",
    "hypothesis==6.122.3",
    "freezegun==1.5.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.5.49",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vibeguard --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# `assert` is how pytest expresses expectations; S101 doesn't apply.
"tests/**" = ["S101"]
# These exercise the auth/remediation persistence layer, whose real
# parameter names (`github_oauth_token_ciphertext`, `token_hash`, etc.)
# contain "token"/"password"-shaped substrings that trip S105/S106 on
# fixture literals like "ciphertext-a" or "hash-a" -- not real secrets.
"tests/adapters/db/test_user_store.py" = ["S105", "S106"]
"tests/adapters/db/test_session_store.py" = ["S105", "S106"]
"tests/adapters/db/test_remediation_store.py" = ["S105", "S106"]
"tests/adapters/db/test_user_model.py" = ["S105", "S106"]
"tests/adapters/db/test_remediation_model.py" = ["S105", "S106"]
"tests/api/routes/test_auth.py" = ["S105", "S106"]
"tests/api/routes/test_remediations.py" = ["S105", "S106", "S107"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends(...)-as-default-argument is the framework's own
# idiom, not the mutable-default-argument bug B008 otherwise catches.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
